<h2>Add New Property</h2>
<form [formGroup]="propertyForm" (ngSubmit)="onSubmit()">
  <label>Title:</label>
  <input formControlName="title" />
  <div *ngIf="propertyForm.get('title')?.invalid && propertyForm.get('title')?.touched">Title required</div>

  <label>Address:</label>
  <input formControlName="address" />
  <div *ngIf="propertyForm.get('address')?.invalid && propertyForm.get('address')?.touched">Address required</div>

  <label>Area:</label>
  <input formControlName="area" />
  <div *ngIf="propertyForm.get('area')?.invalid && propertyForm.get('area')?.touched">Area required</div>

  <label>Sub Area:</label>
  <input formControlName="subArea" />
  <div *ngIf="propertyForm.get('subArea')?.invalid && propertyForm.get('subArea')?.touched">Sub Area required</div>

  <label>Possession Status:</label>
  <select formControlName="possessionStatus">
    <option value="" disabled selected>Select status</option>
    <option value="Ready-to-move">Ready-to-move</option>
    <option value="Under-construction">Under-construction</option>
    <option value="Upcoming">Upcoming</option>
  </select>
  <div *ngIf="propertyForm.get('possessionStatus')?.invalid && propertyForm.get('possessionStatus')?.touched">Possession status required</div>

  <label>Commission Percentage:</label>
  <input type="number" formControlName="commissionPercentage" />
  <div *ngIf="propertyForm.get('commissionPercentage')?.invalid && propertyForm.get('commissionPercentage')?.touched">Must be between 0 and 100</div>

  <h3>Builder Promises</h3>
  <div formArrayName="builderPromises">
    <div *ngFor="let promise of builderPromises.controls; let i = index">
      <input [formControlName]="i" />
    </div>
    <button type="button" (click)="addBuilderPromise()">Add Promise</button>
  </div>

  <h3>Amenities</h3>
  <div formArrayName="amenities">
    <div *ngFor="let amenity of amenities.controls; let i = index">
      <input [formControlName]="i" />
    </div>
    <button type="button" (click)="addAmenity()">Add Amenity</button>
  </div>

  <h3>Variants (at least 1 required)</h3>
  <div formArrayName="variants">
    <div *ngFor="let variant of variants.controls; let i = index" [formGroupName]="i">
      <label>Carpet Size:</label>
      <input formControlName="carpetSize" type="number" />
      <label>Super Built Up Area:</label>
      <input formControlName="superBuiltUpArea" type="number" />
      <label>Price:</label>
      <input formControlName="price" type="number" />
      <label>Floor:</label>
      <input formControlName="floor" type="number" />
      <label>Master Bedroom:</label>
      <input formControlName="masterBedroom" type="checkbox" />
      <label>Modular Kitchen:</label>
      <input formControlName="modularKitchen" type="checkbox" />
    </div>
    <button type="button" (click)="addVariant()">Add Variant</button>
    <div *ngIf="variants.length === 0" style="color:red">Kam se kam ek variant add karo</div>
  </div>

  <button type="submit" [disabled]="propertyForm.invalid || variants.length === 0">Create Property</button>
</form>
